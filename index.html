<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Firebase</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111a2e;
      --panel2: #17233b;
      --border: #2a3854;
      --text: #e8eef9;
      --muted: #9aaac4;
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      background: radial-gradient(ellipse at top left, #172747 0, var(--bg) 55%);
      color: var(--text);
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    .tabs,
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tabs {
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    .tab {
      background: transparent;
      border-color: transparent;
      font-weight: bold;
    }

    .tab.active {
      background: var(--blue);
      color: white;
    }

    .toolbar input {
      flex: 1;
      min-width: 200px;
    }

    input,
    select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0b1426;
      color: var(--text);
    }

    input::placeholder {
      color: #8292ad;
    }

    .add-btn {
      background: #16803c;
      border-color: #16803c;
      color: white;
      font-weight: bold;
    }

    #btnImport {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    th {
      background: #1d3153;
      color: #dbeafe;
      padding: 13px;
      text-transform: uppercase;
      font-size: .8rem;
      letter-spacing: .04em;
    }

    td {
      border-top: 1px solid var(--border);
      padding: 10px;
      text-align: center;
    }

    tbody tr:hover {
      background: #ffffff06;
    }

    td input[type=text] {
      width: 100%;
      min-width: 120px;
    }

    .stock {
      font-size: 18px;
      font-weight: bold;
    }

    .stock.low {
      color: #fb7185;
    }

    img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .delete-btn,
    .warehouse-remove {
      background: #991b1b;
      border-color: #b91c1c;
      color: white;
    }

    .adjust-btn {
      padding: 7px 10px;
      margin: 2px;
    }

    .adjust-input {
      width: 70px;
      text-align: center;
    }

    #secretLogin {
      position: fixed;
      top: 0;
      right: 0;
      width: 24px;
      height: 24px;
      opacity: 0;
      cursor: pointer;
      z-index: 99999;
    }

    #userInfo {
      position: fixed;
      top: 10px;
      right: 10px;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 9px;
      display: none;
      z-index: 9999;
    }

    #loginModal {
      backdrop-filter: blur(7px);
    }

    #loginModal>div {
      background: var(--panel) !important;
      color: var(--text);
      border: 1px solid var(--border);
    }

    #loginModal input {
      width: 100%;
      margin-bottom: 10px;
    }

    @media(max-width:768px) {
      body {
        padding: 12px;
      }

      #userInfo {
        position: static;
        width: fit-content;
        margin-bottom: 15px;
      }

      .toolbar input {
        min-width: 100%;
      }
    }

    .warehouse-remove {
      margin: 4px 8px 4px -6px;
      padding: 8px 10px;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .warehouse-remove:hover {
      background: #b91c1c;
    }


    /* Pantalla de acceso: oculta por completo el inventario a visitantes */
    #guestOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      background: #0b1120;
      color: #e8eef9;
      text-align: center;
    }

    #guestCard {
      width: min(560px, 100%);
      padding: 30px;
      border-radius: 18px;
      background: #111a2e;
      border: 1px solid #354765;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .6);
    }

    #guestCard h2 {
      margin: 0 0 14px;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
    }

    #guestCard p {
      color: #aab8cf;
      margin: 0 0 18px;
    }

    #guestMeme {
      display: block;
      width: min(340px, 100%);
      height: 220px;
      object-fit: contain;
      margin: 0 auto 18px;
      border-radius: 12px;
    }

    #guestCard button {
      display: block;
      margin: 0 auto;
      background: #2563eb;
      color: white;
      border-color: #3b82f6;
    }

    /* El punto de acceso invisible queda por encima de la pantalla de bloqueo */
    #secretLogin {
      z-index: 100002 !important;
    }

    #loginModal {
      z-index: 100010 !important;
    }
  </style>
</head>

<body>

  <div id="secretLogin" title="Acceso"></div>

  <div id="guestOverlay" role="dialog" aria-modal="true" aria-labelledby="guestTitle">
    <div id="guestCard">
      <h2 id="guestTitle">¿Qué coño intentas mirar?</h2>
      <p>Esta zona es para gente con acceso 😉</p>
      <img id="guestMeme" alt="Meme de un gato mirando con sospecha"
        src="https://media.giphy.com/media/VbnUQpprotect4nQ2OZ/giphy.gif"
        onerror="this.onerror=null;this.src='https://media.giphy.com/media/Ju7l5y9rabzdh7sdx7/giphy.gif';">
    </div>
  </div>

  <div id="userInfo">

    <span id="userName"></span>

    <button onclick="logout()">
      Salir
    </button>

  </div>

  <div id="loginModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
z-index:99999;
">

    <div style="
background:white;
padding:20px;
border-radius:10px;
width:320px;
">

      <h3>Acceso</h3>

      <input id="nombre" type="text" placeholder="Nombre" style="
width:100%;
margin-bottom:10px;
padding:8px;
">

      <input id="email" type="email" placeholder="Email" style="
width:100%;
margin-bottom:10px;
padding:8px;
">

      <input id="password" type="password" placeholder="Contraseña" style="
width:100%;
margin-bottom:10px;
padding:8px;
">

      <button onclick="registerUser()">
        Registrar
      </button>

      <button onclick="login()">
        Entrar
      </button>

    </div>

  </div>

  <h1>📦 Inventario</h1>

  <div class="tabs" id="warehouseTabs" aria-label="Almacenes"></div>
  <div class="toolbar" id="warehouseAdmin" style="display:none">
    <input type="text" id="newWarehouseName" maxlength="50" placeholder="Nombre del nuevo almacén">
    <button class="add-btn" onclick="addWarehouse()">＋ Añadir almacén</button>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar producto..." onkeyup="renderTable()">

    <button id="btnAdd" class="add-btn" onclick="addProduct()">
      ➕ Añadir Producto
    </button>
    <button id="btnImport" onclick="migrateLocalData()">
      ⬆️ Importar datos locales
    </button>
  </div>

  <div class="table-wrap">
    <table>

      <thead>
        <tr>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Cantidad</th>
          <th>Movimiento</th>
          <th>Mover</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      onSnapshot
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "AIzaSyBYa4tuy6QIFPsW-cOX4id5l-tH1c8DBZM",
      authDomain: "almacen-71c09.firebaseapp.com",
      projectId: "almacen-71c09",
      storageBucket: "almacen-71c09.appspot.com",
      messagingSenderId: "433934928669",
      appId: "1:433934928669:web:184a41fa33f02413d0eff4"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);

    window.userRole = "guest";

    window.currentUser = null;

    window.currentSection = "casa";

    window.data = JSON.parse(
      localStorage.getItem("inventario")
    ) || {

      casa: [],
      almacenArriba: [],
      almacenMuelle: [],
      warehouseNames: { casa: "Casa", almacenArriba: "Almacén Arriba", almacenMuelle: "Almacén Muelle" }

    };

    const defaultWarehouseNames = { casa: "Casa", almacenArriba: "Almacén Arriba", almacenMuelle: "Almacén Muelle" };
    window.data.warehouseNames = window.data.warehouseNames || {};
    Object.keys(window.data.warehouseNames).forEach(key => { if (!Array.isArray(window.data[key])) window.data[key] = []; });

    function renderWarehouseTabs() {
      const tabs = document.getElementById("warehouseTabs");
      if (!tabs) return;
      tabs.innerHTML = "";
      Object.entries(window.data.warehouseNames).forEach(([key, name]) => {
        const tab = document.createElement("button");
        tab.className = "tab" + (window.currentSection === key ? " active" : "");
        tab.textContent = name;
        tab.onclick = () => window.changeSection(key, tab);
        tabs.appendChild(tab);
        if (window.userRole === "admin") {
          const remove = document.createElement("button");
          remove.className = "warehouse-remove";
          remove.textContent = "✕ Borrar";
          remove.title = "Borrar almacén " + name;
          remove.setAttribute("aria-label", "Borrar almacén " + name);
          remove.onclick = (event) => {
            event.stopPropagation();
            window.deleteWarehouse(key);
          };
          tabs.appendChild(remove);
        }
      });
      document.getElementById("warehouseAdmin").style.display = window.userRole === "admin" ? "flex" : "none";
    }

    window.addWarehouse = async function () {
      if (window.userRole !== "admin") return alert("Solo un administrador puede añadir almacenes.");
      const input = document.getElementById("newWarehouseName");
      const name = input.value.trim();
      if (!name) return alert("Escribe el nombre del almacén.");
      if (Object.values(window.data.warehouseNames).some(n => n.toLowerCase() === name.toLowerCase())) return alert("Ya existe un almacén con ese nombre.");
      const base = name.normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 35) || "almacen";
      let key = "almacen_" + base, n = 2;
      while (Object.prototype.hasOwnProperty.call(window.data.warehouseNames, key)) key = "almacen_" + base + "_" + n++;
      window.data.warehouseNames[key] = name;
      window.data[key] = [];
      window.currentSection = key;
      input.value = "";
      await window.saveData();
      renderWarehouseTabs();
      window.renderTable();
    };

    window.deleteWarehouse = async function (key) {
      if (window.userRole !== "admin") return alert("Solo un administrador puede eliminar almacenes.");
      if (!key) return;
      const name = window.data.warehouseNames[key];
      if (!name) return;
      if (!confirm('¿Eliminar el almacén "' + name + '" y todos sus productos? Esta acción no se puede deshacer.')) return;
      delete window.data[key];
      delete window.data.warehouseNames[key];
      if (window.currentSection === key) window.currentSection = "casa";
      await window.saveData();
      renderWarehouseTabs();
      window.renderTable();
    };

    async function saveToFirebase() {

      try {

        await setDoc(
          doc(db, "inventario", "principal"),
          window.data
        );

      } catch (error) {

        console.error(error);
      }
    }

    async function migrateLocalData() {

      try {

        const localData = JSON.parse(
          localStorage.getItem("inventario")
        );

        if (!localData) {

          alert("No hay datos locales");

          return;
        }

        await setDoc(
          doc(db, "inventario", "principal"),
          localData
        );

        alert(
          "Datos locales importados a Firebase"
        );

      } catch (error) {

        console.error(error);

        alert(
          "Error importando datos"
        );
      }
    }

    window.migrateLocalData = migrateLocalData;

    document
      .getElementById("secretLogin")
      .addEventListener("click", () => {

        document
          .getElementById("loginModal")
          .style.display = "flex";

      });

    window.registerUser = async function () {

      try {

        const nombre =
          document
            .getElementById("nombre")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        if (!nombre) {

          alert("Introduce un nombre");

          return;
        }

        const cred =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        await setDoc(
          doc(
            db,
            "usuarios",
            cred.user.uid
          ),
          {
            nombre: nombre,
            email: email,
            rol: "usuario",
            fechaRegistro:
              new Date().toISOString()
          }
        );

        alert(
          "Usuario creado correctamente"
        );

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    };

    window.login = async function () {

      try {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    };

    window.logout = async function () {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);
      }
    };

    window.updatePermissions = function () {

      const isAdmin =
        window.userRole === "admin";

      const btnAdd =
        document.getElementById("btnAdd");

      const btnImport =
        document.getElementById("btnImport");

      if (btnAdd) {

        btnAdd.style.display =
          isAdmin
            ? "inline-block"
            : "none";
      }

      if (btnImport) btnImport.style.display = isAdmin ? "inline-block" : "none";
      renderWarehouseTabs();
    };

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.currentUser = null;

          window.userRole = "guest";
          document.getElementById("guestOverlay").style.display = "flex";

          document
            .getElementById("secretLogin")
            .style.display =
            "block";

          document
            .getElementById("userInfo")
            .style.display =
            "none";

          updatePermissions();

          renderTable();

          return;
        }

        window.currentUser = user;
        document.getElementById("guestOverlay").style.display = "none";

        try {

          const userDoc =
            await getDoc(
              doc(
                db,
                "usuarios",
                user.uid
              )
            );

          if (userDoc.exists()) {

            const userData =
              userDoc.data();

            window.userRole =
              userData.rol || "usuario";

            document
              .getElementById("userName")
              .innerHTML =
              userData.nombre +
              " (" +
              window.userRole +
              ")";

          } else {

            window.userRole =
              "usuario";
          }

        } catch (error) {

          console.error(error);

          window.userRole =
            "usuario";
        }

        document
          .getElementById("loginModal")
          .style.display =
          "none";

        document
          .getElementById("secretLogin")
          .style.display =
          "none";

        document
          .getElementById("userInfo")
          .style.display =
          "block";

        updatePermissions();

        renderTable();

      }
    );

    async function loadFromFirebase() {

      try {

        const snap = await getDoc(
          doc(db, "inventario", "principal")
        );

        if (snap.exists()) {

          window.data = snap.data();
          window.data.warehouseNames = window.data.warehouseNames || {};
          Object.keys(window.data.warehouseNames).forEach(key => { if (!Array.isArray(window.data[key])) window.data[key] = []; });
          renderWarehouseTabs();

          localStorage.setItem(
            "inventario",
            JSON.stringify(window.data)
          );

          renderTable();
        }

      } catch (error) {

        console.error(error);
      }
    }

    function startRealtimeSync() {

      onSnapshot(
        doc(db, "inventario", "principal"),
        (snapshot) => {

          if (snapshot.exists()) {

            window.data = snapshot.data();
            window.data.warehouseNames = window.data.warehouseNames || {};
            Object.keys(window.data.warehouseNames).forEach(key => { if (!Array.isArray(window.data[key])) window.data[key] = []; });
            renderWarehouseTabs();

            localStorage.setItem(
              "inventario",
              JSON.stringify(window.data)
            );

            renderTable();
          }
        }
      );
    }

    window.saveData = async function () {

      localStorage.setItem(
        "inventario",
        JSON.stringify(window.data)
      );

      await saveToFirebase();
    };

    window.changeSection = function (section, button) {

      currentSection = section;

      document.querySelectorAll(".tab")
        .forEach(tab => tab.classList.remove("active"));

      button.classList.add("active");

      renderTable();
    };

    window.addProduct = function () {

      data[currentSection].push({

        img: "",
        nombre: "",
        cantidad: 0

      });

      saveData();
      renderTable();
    };

    window.updateName = function (index, value) {

      data[currentSection][index].nombre = value;

      saveData();
    };

    window.updateImage = function (index, input) {

      const file = input.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {

        data[currentSection][index].img =
          e.target.result;

        saveData();
        renderTable();
      };

      reader.readAsDataURL(file);
    };

    window.adjustStock = function (index, amount) {

      let stock =
        Number(data[currentSection][index].cantidad) || 0;

      stock += amount;

      if (stock < 0) {
        stock = 0;
      }

      data[currentSection][index].cantidad = stock;

      saveData();
      renderTable();
    };

    window.deleteProduct = function (index) {

      if (confirm("¿Eliminar producto?")) {

        data[currentSection].splice(index, 1);

        saveData();
        renderTable();
      }
    };

    window.moveProduct = function (index, destination) {

      if (destination === currentSection) return;

      const product =
        data[currentSection][index];

      data[destination].push(product);

      data[currentSection].splice(index, 1);

      saveData();
      renderTable();
    };
    window.renderTable = function () {

      const tbody =
        document.getElementById("tableBody");

      const search =
        document.getElementById("search")
          .value
          .toLowerCase();

      tbody.innerHTML = "";

      data[currentSection].forEach((item, index) => {

        if (
          !item.nombre.toLowerCase().includes(search)
          &&
          !String(item.cantidad)
            .includes(search)
        ) {
          return;
        }

        const lowClass =
          item.cantidad <= 5
            ? "low"
            : "";

        tbody.innerHTML += `

        <tr>

            <td>

                ${item.img

            ?

            `<img src="${item.img}">`

            :

            `<input
                        type="file"
                        accept="image/*"
                        onchange="updateImage(${index},this)">`
          }

            </td>

            <td>

                <input
                    type="text"
                    value="${item.nombre}"
                    onchange="updateName(${index},this.value)"
                    placeholder="Nombre producto">

            </td>

            <td>

                <span class="stock ${lowClass}">
                    ${Number(item.cantidad)
            .toLocaleString('es-ES')}
                </span>

            </td>

            <td>

${window.userRole === "admin"

            ?

            `

<input
type="number"
id="mov${index}"
class="adjust-input"
value="1"
min="1">

<button
class="adjust-btn"
onclick="adjustStock(
${index},
parseInt(
document.getElementById(
'mov${index}'
).value || 1
)
)">
➕
</button>

<button
class="adjust-btn"
onclick="adjustStock(
${index},
-parseInt(
document.getElementById(
'mov${index}'
).value || 1
)
)">
➖
</button>

`

            :

            `Solo lectura`

          }

</td>

            <td>

${window.userRole === "admin"

            ?

            `

<select
onchange="moveProduct(
${index},
this.value
)">

<option value="">
Mover...
</option>

${Object.entries(window.data.warehouseNames).map(([key, name]) => `<option value="${key}">${name}</option>`).join("")}

</select>

`

            :

            `Solo lectura`

          }

</td>

            <td>

${window.userRole === "admin"

            ?

            `

<button
class="delete-btn"
onclick="deleteProduct(${index})">
Eliminar
</button>

`

            :

            `Solo lectura`

          }

</td>

        </tr>

        `;
      });
    };

    renderWarehouseTabs();
    loadFromFirebase();

    startRealtimeSync();

  </script>

</body>

</html>
